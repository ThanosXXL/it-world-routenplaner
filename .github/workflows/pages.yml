name: Routenplaner → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (Einzeldatei, Kunden-Paket, Offline-Installer)
        run: |
          pip install fonttools brotli
          python build.py
          python pkg_build.py
          python build_inst.py
      - name: Site zusammenstellen
        run: |
          mkdir site
          cp -r build/pkg/IT-WORLD-Routenplaner/. site/
          cp build/IT-WORLD-Routenplaner-Vollinstallation.zip site/
          cp build/IT-WORLD-Routenplaner-Installer.html site/
          rm -f site/_headers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
